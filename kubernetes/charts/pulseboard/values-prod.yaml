# ── Prod overrides ────────────────────────────────────────────
# Higher replicas, HPA enabled, tighter limits, external DB (RDS).
# Apply with: helm upgrade --install pulseboard . -f values.yaml -f values-prod.yaml

api:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
  env:
    LOG_LEVEL: "info"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  serviceMonitor:
    enabled: false    # enable after kube-prometheus-stack is installed (observability phase)

frontend:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: pulseboard.example.com
  tls: true
  tlsSecretName: pulseboard-tls

# Using in-cluster postgres locally; switch to RDS (enabled: false) when deploying to EKS.
postgresql:
  enabled: true
  auth:
    password: prod-password

externalDatabase:
  host: ""          # set to your RDS endpoint
  port: 5432
  username: pulseboard
  database: pulseboard
  # Create the secret before deploying:
  #   kubectl create secret generic pulseboard-externaldb \
  #     --from-literal=db-password=<rds-password>
