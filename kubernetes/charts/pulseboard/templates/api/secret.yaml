{{/*
  Builds the DATABASE_URL for the API container.

  When postgresql.enabled=true  → uses credentials from values (stored in our
                                   postgresql secret, constructed here).
  When postgresql.enabled=false → uses externalDatabase values (RDS in prod).

  In production replace this with an ExternalSecret (External Secrets Operator
  + AWS Secrets Manager). The key name stays the same so the Deployment needs
  no changes.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulseboard.api.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable"
    .Values.postgresql.auth.username
    .Values.postgresql.auth.password
    (include "pulseboard.postgresql.host" .)
    .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgres://%s@%s:%d/%s?sslmode=require"
    .Values.externalDatabase.username
    .Values.externalDatabase.host
    (.Values.externalDatabase.port | int)
    .Values.externalDatabase.database | quote }}
  {{- end }}
