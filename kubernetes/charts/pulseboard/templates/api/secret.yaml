{{/*
  Creates a Secret holding the DATABASE_URL for the API.

  When postgresql.enabled=true  → password comes from values (bitnami also creates
                                   its own secret; this one is just for our DATABASE_URL).
  When postgresql.enabled=false → password is read from externalDatabase.existingSecret
                                   or you pre-create the secret manually.

  In production, replace this entire Secret with an ExternalSecret (External Secrets
  Operator + AWS Secrets Manager). The key name stays the same so the Deployment
  template needs no changes.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulseboard.api.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable"
    .Values.postgresql.auth.username
    .Values.postgresql.auth.password
    (include "pulseboard.postgresql.host" .)
    .Values.postgresql.auth.database | quote }}
{{- end }}
