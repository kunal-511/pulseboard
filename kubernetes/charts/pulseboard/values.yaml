# ──────────────────────────────────────────────────────────────
# PulseBoard — default values
# Override per environment using values-dev.yaml / values-prod.yaml
# ──────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── API ────────────────────────────────────────────────────────
api:
  image:
    repository: ghcr.io/kunal-511/pulseboard-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Extra environment variables injected into the API container.
  # Set OTEL_EXPORTER_OTLP_ENDPOINT here once Tempo is installed.
  env: {}
  #  OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
  #  LOG_LEVEL: "info"

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  # Horizontal Pod Autoscaler — disabled by default, enabled in prod.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # ServiceMonitor for Prometheus scraping.
  # Requires kube-prometheus-stack to be installed first (Week 3).
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# ── Frontend ───────────────────────────────────────────────────
frontend:
  image:
    repository: ghcr.io/kunal-511/pulseboard-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

  securityContext:
    runAsNonRoot: true
    runAsUser: 101        # nginx default user
    allowPrivilegeEscalation: false
    # readOnlyRootFilesystem omitted — nginx writes to /etc/nginx at startup

# ── Ingress ────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  host: pulseboard.local
  tls: false
  tlsSecretName: pulseboard-tls

# ── PostgreSQL ─────────────────────────────────────────────────
# Uses the official postgres image — no external chart dependency.
# Set enabled: false in prod and point externalDatabase at RDS.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: pulseboard
    password: pulseboard   # overridden per-env; use External Secrets in prod
    database: pulseboard
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── External database (used when postgresql.enabled=false) ─────
# Point this at RDS when deploying to EKS.
externalDatabase:
  host: ""          # e.g. my-rds.xxxx.rds.amazonaws.com
  port: 5432
  username: pulseboard
  database: pulseboard
